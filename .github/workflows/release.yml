name: Release

# Runs when you push a version tag like v1.0, v1.1, etc.
on:
  push:
    tags:
      - 'v*'

# Needed so the workflow can create a GitHub Release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The keystore itself is NOT in git. We store it as a base64 secret and
      # decode it back into a file here, just for this build.
      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK to include the version
        run: cp app/build/outputs/apk/release/app-release.apk sleep-timer-tile-${{ github.ref_name }}.apk

      - name: Publish GitHub Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          files: sleep-timer-tile-${{ github.ref_name }}.apk
          generate_release_notes: true

      # Clean up the decoded keystore (belt-and-suspenders; the runner is
      # ephemeral anyway).
      - name: Remove keystore
        if: always()
        run: rm -f release-keystore.jks
